name: Build Pixpfs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Export (Web + Windows)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import assets
        run: godot --headless --path . --import

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/Pixpfs.exe

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixpfs-web
          path: build/web

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixpfs-windows
          path: build/windows

  build-ios:
    name: Export iOS IPA (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.4.1
        run: |
          set -e
          curl -fL "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -o "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot-bin" -type f -path '*/Contents/MacOS/Godot' -print -quit)"
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN="$(find "$RUNNER_TEMP/godot-bin" -type f -name Godot -print -quit)"
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install Godot export templates
        run: |
          set -e
          curl -fL "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/template-extract"
          unzip -o "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/template-extract"
          TEMPLATE_DIR="$(find "$RUNNER_TEMP/template-extract" -type d -name templates -print -quit)"
          if [ -z "$TEMPLATE_DIR" ]; then
            TEMPLATE_DIR="$RUNNER_TEMP/template-extract"
          fi
          DEST="$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable"
          mkdir -p "$DEST"
          cp -R "$TEMPLATE_DIR"/. "$DEST/"

      - name: Generate iOS icons
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/ios-venv"
          "$RUNNER_TEMP/ios-venv/bin/python" -m pip install --quiet Pillow
          ICON_DIR="assets/icons"
          mkdir -p "$ICON_DIR"
          "$RUNNER_TEMP/ios-venv/bin/python" - "$ICON_DIR" <<'PY'
          from PIL import Image
          import os, sys
          out = sys.argv[1]
          src = Image.open("assets/textures/icon.png").convert("RGB")
          big = src.resize((1024, 1024), Image.NEAREST)
          big.save(os.path.join(out, "app_store_1024.png"))
          for name, size in {
              "iphone_120.png": 120,
              "iphone_180.png": 180,
              "ipad_76.png": 76,
              "ipad_152.png": 152,
              "ipad_167.png": 167,
          }.items():
              big.resize((size, size), Image.LANCZOS).save(os.path.join(out, name))
          PY

      - name: Import Godot project
        run: |
          set -e
          "$GODOT" --headless --editor --path . --quit

      - name: Create iOS export preset
        run: |
          set -e
          cat > export_presets.cfg <<'PRESET'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/pixpfs.zip"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          application/bundle_identifier="com.hann.pixpfs"
          application/short_version="1.0.0"
          application/version="1.0.0"
          application/name="Pixpfs"
          application/export_project_only=true
          display/orientation="landscape"
          icons/iphone_120x120="res://assets/icons/iphone_120.png"
          icons/iphone_180x180="res://assets/icons/iphone_180.png"
          icons/ipad_76x76="res://assets/icons/ipad_76.png"
          icons/ipad_152x152="res://assets/icons/ipad_152.png"
          icons/ipad_167x167="res://assets/icons/ipad_167.png"
          icons/app_store_1024x1024="res://assets/icons/app_store_1024.png"
          PRESET

      - name: Export iOS Xcode project
        run: |
          set -e
          mkdir -p build
          "$GODOT" --headless --path . --export-release "iOS" build/pixpfs.zip
          test -s build/pixpfs.zip

      - name: Extract Xcode project
        run: |
          set -e
          mkdir -p build/xcode
          unzip -o build/pixpfs.zip -d build/xcode
          XCODEPROJ="$(find build/xcode -name '*.xcodeproj' -print -quit)"
          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: 导出 ZIP 中没有 Xcode 项目"
            find build/xcode -maxdepth 5 -print
            exit 1
          fi
          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"

      - name: Build unsigned iOS app
        run: |
          set -e
          SCHEME="$(basename "$XCODEPROJ" .xcodeproj)"
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP_PATH="$(find build/DerivedData/Build/Products -maxdepth 5 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Xcode 没有生成 .app"
            find build/DerivedData/Build/Products -maxdepth 5 -print
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package IPA
        run: |
          set -e
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../pixpfs-unsigned.ipa Payload
          test -s ../pixpfs-unsigned.ipa
          ls -lh ../pixpfs-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixpfs-ios-ipa
          path: |
            build/pixpfs-unsigned.ipa
            build/pixpfs.zip
          if-no-files-found: warn
          retention-days: 14

  deploy-pages:
    name: Deploy Web to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: pixpfs-web
          path: build/web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
